<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Location</title>
    <style>
        /* Makes the entire page white, unscrollable, and clickable */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        /* Style for the central text */
        .click-text {
            font-size: 24px;
            color: #333333;
        }
    </style>
</head>
<body>

    <div class="click-text">Click here</div>

    <script>
        // Listen for a click anywhere on the page
        document.body.addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }

            // Request the user's current position
            navigator.geolocation.getCurrentPosition(successCallback, errorCallback, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        });

        function successCallback(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // Send the data to your Node.js backend server
            fetch('/api/location', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ latitude, longitude })
            })
            .then(response => {
                if (response.ok) {
                    alert('Done!');
                } else {
                    alert('Failed.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while sharing location.');
            });
        }

        function errorCallback(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    alert("User denied the request.");
                    break;
                case error.POSITION_UNAVAILABLE:
                    alert("information is unavailable.");
                    break;
                case error.TIMEOUT:
                    alert("The request to get user timed out.");
                    break;
                case error.UNKNOWN_ERROR:
                    alert("An unknown error occurred.");
                    break;
            }
        }
    </script>
</body>
</html>
